[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudekit"
version = "0.1.0"
description = "Reusable platform layer for self-hosted apps: Claude Code agents, a report/approval loop, a job scheduler, service control and config editing."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "pydantic>=2"]
flask = ["flask>=3"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
